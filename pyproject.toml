[project]
name = "jev-agentic-workflow"
version = "0.1.0"
description = "TypeSafe/Jev-powered auto-mode middleware for safe, intent-gated tool execution"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "black>=26.5.1",
    "fastapi>=0.141.1",
    "langchain-openrouter>=0.2.8",
    "langchain-typesafe[experimental]>=0.0.1a3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.13",
]
